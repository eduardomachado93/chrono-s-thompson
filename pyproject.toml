[project]
name = "chrono-s-thompson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eduardo Felipe Machado", email = "eduardofelipemachado93@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "ipykernel>=6.29.0",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "openai>=3.5.0",
    "streamlit>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "bs4>=0.0.2",
    "transformers>=4.40.0",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.0",
    "torchvision>=0.29.0",
    "grandalf>=0.8",
]

[project.scripts]
chrono-s-thompson = "chrono_s_thompson:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["src", "."]

